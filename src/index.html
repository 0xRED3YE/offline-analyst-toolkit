<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Development CSP. build.js replaces it with the production policy (no 'self': everything is inlined). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data: blob:; worker-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Offline Analyst Toolkit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23c0392b'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">Offline Analyst Toolkit</span>
    <span class="brand-by">0xRED3YE</span>
  </div>
  <div class="topbar-right">
    <span class="badge-offline" title="This page cannot make network requests: its Content-Security-Policy sets connect-src 'none'. Nothing you paste or drop leaves this browser.">
      <span class="dot" aria-hidden="true"></span>100% offline
    </span>
    <button type="button" id="theme-toggle" class="btn btn-ghost" aria-label="Toggle light or dark theme">Theme</button>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" aria-label="Modules">
    <ul id="module-list" class="module-list"></ul>
    <p class="sidebar-hint">Alt+1…9 switches between the first nine</p>
  </nav>
  <label class="module-select-wrap">
    <span class="visually-hidden">Module</span>
    <select id="module-select" class="module-select"></select>
  </label>
  <main id="main" class="main"></main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- build.js inlines these in order -->
<script src="app.js"></script>
<script src="lib/codecs.js"></script>
<script src="lib/hashes.js"></script>
<script src="lib/tlds.js"></script>
<script src="lib/ioc.js"></script>
<script src="lib/jwt.js"></script>
<script src="lib/time.js"></script>
<script src="lib/email.js"></script>
<script src="lib/lookup.js"></script>
<script src="lib/url.js"></script>
<script src="lib/psdeobf.js"></script>
<script src="lib/diff.js"></script>
<script src="lib/regex.js"></script>
<script src="lib/entropy.js"></script>
<script src="lib/casereport.js"></script>
<!-- Sidebar order and groups are set in app.js (NAV_GROUPS) -->
<script src="modules/encode.js"></script>
<script src="modules/hashing.js"></script>
<script src="modules/ioc.js"></script>
<script src="modules/defang.js"></script>
<script src="modules/jwt.js"></script>
<script src="modules/timestamp.js"></script>
<script src="modules/email.js"></script>
<script src="modules/lookup.js"></script>
<script src="modules/url.js"></script>
<script src="modules/psdeobf.js"></script>
<script src="modules/diff.js"></script>
<script src="modules/regex.js"></script>
<script src="modules/entropy.js"></script>
<script src="modules/casenotes.js"></script>
</body>
</html>
