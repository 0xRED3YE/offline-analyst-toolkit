<script>
/*
 * Encode / Decode module: build a recipe of byte-level steps (Base64, hex, URL,
 * HTML entities, ROT13, binary, Unicode escapes, UTF-16LE). Runs live as you type.
 * Auto-detect looks at the current output and suggests the next decode steps.
 */
(function () {
  'use strict';

  const C = window.OAT.codecs;
  const DISPLAY_LIMIT = 1024 * 1024;   // characters shown in Text view; copy/download use everything

  window.OAT.register({
    id: 'encode',
    name: 'Encode / Decode',
    summary: 'Base64, hex, URL, HTML entities, ROT13, binary, Unicode escapes and UTF-16LE. Chain steps into a recipe; auto-detect suggests what to decode next.',

    render(root, ctx) {
      const { h } = ctx;

      const state = {
        fileBytes: null,     // set when a file is loaded; overrides the text box
        fileName: null,
        steps: [],           // op ids
        view: 'text',        // 'text' | 'hex'
        output: new Uint8Array(0),
      };

      // ---------------------------------------------------------- Input

      const input = h('textarea', {
        class: 'io', spellcheck: 'false', autocomplete: 'off', 'aria-label': 'Input',
        placeholder: 'Paste or type data here, or drop a file',
      });
      const fileInput = h('input', { type: 'file', hidden: true, 'aria-hidden': 'true' });
      const fileChip = h('span', { class: 'chip', hidden: true });
      const inputMeta = h('span', { class: 'meta' });

      const inputPanel = h('div', { class: 'panel' },
        h('div', { class: 'panel-head' },
          h('h2', { class: 'panel-title' }, 'Input'),
          h('div', { class: 'row' },
            fileChip,
            inputMeta,
            h('button', { type: 'button', class: 'btn btn-small', onclick: () => fileInput.click() }, 'Open file…'),
            h('button', { type: 'button', class: 'btn btn-small', onclick: clearAll }, 'Clear'))),
        input,
        fileInput);

      // ---------------------------------------------------------- Recipe

      const stepList = h('ol', { class: 'steps', 'aria-label': 'Recipe steps' });
      const stepsEmpty = h('p', { class: 'steps-empty' }, 'No steps yet. Add one below, or pick an auto-detect suggestion.');
      const addSelect = opSelect('', 'Add step…');
      addSelect.setAttribute('aria-label', 'Add a step');
      addSelect.addEventListener('change', () => {
        if (addSelect.value) { state.steps.push(addSelect.value); addSelect.value = ''; renderSteps(); run(); }
      });

      const quick = ['b64-decode', 'hex-decode', 'url-decode', 'b64-encode'].map((id) =>
        h('button', { type: 'button', class: 'btn btn-small', onclick: () => { state.steps.push(id); renderSteps(); run(); } },
          `+ ${C.OP_BY_ID[id].label}`));

      const recipePanel = h('div', { class: 'panel' },
        h('div', { class: 'panel-head' },
          h('h2', { class: 'panel-title' }, 'Recipe'),
          h('button', { type: 'button', class: 'btn btn-small', onclick: () => { state.steps = []; renderSteps(); run(); } }, 'Clear steps')),
        stepsEmpty,
        stepList,
        h('div', { class: 'row' }, addSelect, quick));

      // ---------------------------------------------------------- Suggestions

      const suggestionList = h('div', { class: 'suggestions' });
      const suggestPanel = h('div', { class: 'panel', hidden: true },
        h('div', { class: 'panel-head' },
          h('h2', { class: 'panel-title' }, 'Auto-detect'),
          h('span', { class: 'meta' }, 'Looks like… (click to add as steps)')),
        suggestionList);

      // ---------------------------------------------------------- Output

      const output = h('pre', { class: 'output', tabindex: '0', 'aria-label': 'Output', 'aria-live': 'polite', 'data-empty': 'Output appears here' });
      const outputMeta = h('span', { class: 'meta' });
      const outputNotice = h('p', { class: 'notice', hidden: true });

      const viewText = h('button', { type: 'button', 'aria-pressed': 'true', onclick: () => setView('text') }, 'Text');
      const viewHex = h('button', { type: 'button', 'aria-pressed': 'false', onclick: () => setView('hex') }, 'Hex');

      const sendSelect = h('select', { 'aria-label': 'Send output to another module' });
      sendSelect.addEventListener('change', () => {
        if (sendSelect.value) { ctx.sendTo(sendSelect.value, C.text(state.output)); sendSelect.value = ''; }
      });

      const outputPanel = h('div', { class: 'panel' },
        h('div', { class: 'panel-head' },
          h('div', { class: 'row' },
            h('h2', { class: 'panel-title' }, 'Output'),
            h('span', { class: 'seg', role: 'group', 'aria-label': 'Output view' }, viewText, viewHex),
            outputMeta),
          h('div', { class: 'row' },
            h('button', { type: 'button', class: 'btn btn-small', onclick: copyOutput }, 'Copy'),
            h('button', { type: 'button', class: 'btn btn-small', onclick: downloadOutput }, 'Download'),
            sendSelect,
            h('button', { type: 'button', class: 'btn btn-small', title: 'Use the output as the new input and clear the recipe', onclick: outputToInput }, 'Use as input'))),
        outputNotice,
        output);

      root.append(inputPanel, recipePanel, suggestPanel, outputPanel);

      // ---------------------------------------------------------- Behaviour

      function opSelect(value, placeholder) {
        const sel = h('select', null);
        if (placeholder) sel.append(h('option', { value: '' }, placeholder));
        for (const group of ['Decode', 'Encode', 'Other']) {
          const og = h('optgroup', { label: group });
          for (const op of C.OPS.filter((o) => o.group === group)) og.append(h('option', { value: op.id }, op.label));
          sel.append(og);
        }
        sel.value = value;
        return sel;
      }

      function renderSteps(results = []) {
        stepList.replaceChildren();
        stepsEmpty.hidden = state.steps.length > 0;
        state.steps.forEach((id, i) => {
          const sel = opSelect(id);
          sel.setAttribute('aria-label', `Step ${i + 1} operation`);
          sel.addEventListener('change', () => { state.steps[i] = sel.value; run(); });
          const r = results[i];
          const status = h('span', { class: 'step-status' });
          if (r && r.ok) { status.classList.add('ok'); status.textContent = `${formatSize(r.bytes.length)}`; }
          else if (r && !r.ok) { status.classList.add('err'); status.textContent = r.error; }
          else if (results.length) { status.textContent = 'not run'; }
          stepList.append(h('li', { class: 'step' },
            sel,
            h('button', { type: 'button', class: 'btn btn-small', 'aria-label': `Move step ${i + 1} up`, disabled: i === 0, onclick: () => moveStep(i, -1) }, '↑'),
            h('button', { type: 'button', class: 'btn btn-small', 'aria-label': `Remove step ${i + 1}`, onclick: () => { state.steps.splice(i, 1); renderSteps(); run(); } }, '✕'),
            status));
        });
      }

      function moveStep(i, delta) {
        const j = i + delta;
        if (j < 0 || j >= state.steps.length) return;
        [state.steps[i], state.steps[j]] = [state.steps[j], state.steps[i]];
        renderSteps();
        run();
      }

      function inputBytes() {
        return state.fileBytes || C.utf8(input.value);
      }

      function run() {
        const src = inputBytes();
        const results = C.runRecipe(src, state.steps);
        renderSteps(results);

        const failed = results.find((r) => !r.ok);
        const lastGood = [...results].reverse().find((r) => r.ok);
        state.output = lastGood ? lastGood.bytes : src;

        if (failed) {
          const n = results.indexOf(failed) + 1;
          outputNotice.textContent = `Step ${n} failed: ${failed.error}. ${n > 1 ? `Showing the output of step ${n - 1}.` : 'Showing the input unchanged.'}`;
          outputNotice.hidden = false;
        } else {
          outputNotice.hidden = true;
        }

        renderOutput();
        renderSuggestions();
        refreshSendTargets();
      }

      function renderOutput() {
        const bytes = state.output;
        const printable = C.printableRatio(bytes);
        const kind = C.sniff(bytes);
        outputMeta.textContent = bytes.length
          ? `${formatSize(bytes.length)}${kind ? ` · ${kind}` : printable < 0.85 ? ' · looks binary' : ''}`
          : '';
        if (state.view === 'hex') {
          output.classList.add('hexview');
          const dump = C.hexdump(bytes);
          output.textContent = bytes.length > 65536 ? `${dump}\n… (hex view shows the first 64 KB)` : dump;
        } else {
          output.classList.remove('hexview');
          const t = C.text(bytes);
          output.textContent = t.length > DISPLAY_LIMIT ? `${t.slice(0, DISPLAY_LIMIT)}\n… (display truncated; Copy and Download include everything)` : t;
        }
      }

      function renderSuggestions() {
        // Only suggest for text-sized output; detection on huge binary is pointless.
        const bytes = state.output;
        const list = bytes.length && bytes.length < 5 * 1024 * 1024 ? C.detect(C.text(bytes)) : [];
        suggestionList.replaceChildren(...list.map((s) =>
          h('button', {
            type: 'button', class: 'suggestion',
            onclick: () => { state.steps.push(...s.ops); renderSteps(); run(); },
          },
          h('span', { class: 'suggestion-label' }, s.label),
          h('span', { class: 'suggestion-score' }, `${Math.round(Math.min(s.score, 1) * 100)}% confidence`),
          h('span', { class: 'suggestion-preview' }, s.preview))));
        suggestPanel.hidden = list.length === 0;
      }

      function refreshSendTargets() {
        const targets = ctx.sendTargets();
        sendSelect.replaceChildren(h('option', { value: '' }, targets.length ? 'Send to…' : 'Send to… (more modules soon)'),
          ...targets.map((t) => h('option', { value: t.id }, t.name)));
        sendSelect.disabled = targets.length === 0;
      }

      function setView(v) {
        state.view = v;
        viewText.setAttribute('aria-pressed', String(v === 'text'));
        viewHex.setAttribute('aria-pressed', String(v === 'hex'));
        renderOutput();
      }

      function copyOutput() {
        ctx.copy(state.view === 'hex' ? C.hexdump(state.output, Infinity) : C.text(state.output));
      }

      function downloadOutput() {
        const isText = C.printableRatio(state.output) >= 0.85;
        ctx.download(isText ? 'output.txt' : 'output.bin', state.output, isText ? 'text/plain;charset=utf-8' : 'application/octet-stream');
      }

      function outputToInput() {
        const bytes = state.output;
        state.steps = [];
        if (C.printableRatio(bytes) >= 0.85) setText(C.text(bytes));
        else setFile(bytes, 'previous output');
        renderSteps();
        run();
      }

      function setText(value) {
        clearFile();
        input.value = value;
      }

      function setFile(bytes, name) {
        state.fileBytes = bytes;
        state.fileName = name;
        input.value = '';
        input.disabled = true;
        input.placeholder = 'Using file input. Remove the file to type again.';
        fileChip.replaceChildren(`File: ${name} (${formatSize(bytes.length)})`,
          h('button', { type: 'button', class: 'btn btn-ghost btn-small', 'aria-label': 'Remove file', onclick: () => { clearFile(); run(); } }, '✕'));
        fileChip.hidden = false;
      }

      function clearFile() {
        state.fileBytes = null;
        state.fileName = null;
        input.disabled = false;
        input.placeholder = 'Paste or type data here, or drop a file';
        fileChip.hidden = true;
        updateInputMeta();
      }

      function clearAll() {
        clearFile();
        input.value = '';
        updateInputMeta();
        run();
        input.focus();
      }

      async function loadFile(file) {
        if (!file) return;
        if (file.size > 200 * 1024 * 1024) {
          ctx.toast('File is over 200 MB; too large for in-page decoding');
          return;
        }
        const bytes = new Uint8Array(await file.arrayBuffer());
        setFile(bytes, file.name);
        updateInputMeta();
        run();
      }

      function updateInputMeta() {
        inputMeta.textContent = state.fileBytes ? '' : input.value ? `${formatSize(C.utf8(input.value).length)}` : '';
      }

      let timer = null;
      input.addEventListener('input', () => {
        updateInputMeta();
        clearTimeout(timer);
        timer = setTimeout(run, 120);
      });

      fileInput.addEventListener('change', () => { loadFile(fileInput.files[0]); fileInput.value = ''; });

      // Drop a file anywhere on the input panel.
      inputPanel.addEventListener('dragover', (e) => { e.preventDefault(); input.classList.add('dragover'); });
      inputPanel.addEventListener('dragleave', () => input.classList.remove('dragover'));
      inputPanel.addEventListener('drop', (e) => {
        e.preventDefault();
        input.classList.remove('dragover');
        const file = e.dataTransfer && e.dataTransfer.files[0];
        if (file) loadFile(file);
      });

      renderSteps();
      run();

      return {
        receive(value) { state.steps = []; setText(value); updateInputMeta(); renderSteps(); run(); },
        focus() { if (!input.disabled) input.focus(); },
      };
    },
  });

  function formatSize(n) {
    if (n < 1024) return `${n} B`;
    if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
    return `${(n / 1024 / 1024).toFixed(1)} MB`;
  }
})();
</script>
<script>
/*
 * Hashing module: MD5 / SHA-1 / SHA-256 / SHA-384 / SHA-512 of text or files.
 * Files are read in 4 MB chunks inside a Web Worker (built from an inline blob,
 * so it also works when the page is opened from file://). If a worker cannot
 * start, hashing falls back to the main thread with the same chunking.
 */
(function () {
  'use strict';

  const H = window.OAT.hashes;
  const C = window.OAT.codecs;
  const ALGS = ['md5', 'sha1', 'sha256', 'sha384', 'sha512'];
  const DEFAULT_ON = new Set(['md5', 'sha1', 'sha256', 'sha512']);
  const CHUNK = 4 * 1024 * 1024;

  const WORKER_SOURCE = `'use strict';
const H = ${H.factorySource}();
self.onmessage = async (e) => {
  const { file, algs, chunk } = e.data;
  try {
    const hashers = algs.map((a) => H.createHash(a));
    for (let off = 0; off < file.size; off += chunk) {
      const buf = new Uint8Array(await file.slice(off, off + chunk).arrayBuffer());
      for (const h of hashers) h.update(buf);
      self.postMessage({ type: 'progress', done: Math.min(off + chunk, file.size) });
    }
    self.postMessage({ type: 'done', results: hashers.map((h) => [h.algorithm, H.toHex(h.digest())]) });
  } catch (err) {
    self.postMessage({ type: 'error', message: String(err && err.message || err) });
  }
};`;

  let workerUrl = null;
  function getWorkerUrl() {
    if (!workerUrl) workerUrl = URL.createObjectURL(new Blob([WORKER_SOURCE], { type: 'text/javascript' }));
    return workerUrl;
  }

  // Hash a File. Returns { promise, cancel }. promise resolves to { results: [[alg, hex]], mode }.
  function hashFile(file, algs, onProgress) {
    let cancelled = false;
    let worker = null;

    const mainThread = async () => {
      const hashers = algs.map((a) => H.createHash(a));
      for (let off = 0; off < file.size; off += CHUNK) {
        if (cancelled) throw new Error('Cancelled');
        const buf = new Uint8Array(await file.slice(off, off + CHUNK).arrayBuffer());
        for (const h of hashers) h.update(buf);
        onProgress(Math.min(off + CHUNK, file.size));
        await new Promise((r) => setTimeout(r, 0));   // keep the page responsive
      }
      return { results: hashers.map((h) => [h.algorithm, H.toHex(h.digest())]), mode: 'main thread' };
    };

    let rejectPromise = null;
    const promise = new Promise((resolve, reject) => {
      rejectPromise = reject;
      let started = false;
      const fallback = () => { if (worker) worker.terminate(); worker = null; mainThread().then(resolve, reject); };
      try {
        worker = new Worker(getWorkerUrl());
      } catch (_) {
        fallback();
        return;
      }
      worker.onmessage = (e) => {
        const m = e.data;
        if (m.type === 'progress') { started = true; onProgress(m.done); }
        else if (m.type === 'done') { worker.terminate(); resolve({ results: m.results, mode: 'Web Worker' }); }
        else if (m.type === 'error') { worker.terminate(); reject(new Error(m.message)); }
      };
      worker.onerror = (e) => {
        e.preventDefault();
        if (!started && !cancelled) fallback();
        else { worker.terminate(); reject(new Error(e.message || 'Worker error')); }
      };
      worker.postMessage({ file, algs, chunk: CHUNK });
    });

    return {
      promise,
      cancel() {
        cancelled = true;
        if (worker) { worker.terminate(); rejectPromise(new Error('Cancelled')); }
        // On the main-thread path the loop sees `cancelled` and rejects itself.
      },
    };
  }

  window.OAT.register({
    id: 'hash',
    name: 'Hashing',
    summary: 'MD5, SHA-1, SHA-256, SHA-384 and SHA-512 of text or files of any size. Files are read in chunks on your machine and never uploaded.',

    render(root, ctx) {
      const { h, ui } = ctx;
      const state = { textResults: [], files: [], upper: false };

      // ---------------------------------------------------------- Options

      const algBoxes = Object.fromEntries(ALGS.map((a) => [a, h('input', { type: 'checkbox', checked: DEFAULT_ON.has(a) })]));
      const upperBox = h('input', { type: 'checkbox' });
      const options = h('div', { class: 'row options' },
        ALGS.map((a) => h('label', { class: 'check' }, algBoxes[a], H.NAMES[a])),
        h('span', { class: 'sep' }),
        h('label', { class: 'check' }, upperBox, 'Uppercase'));
      const selectedAlgs = () => ALGS.filter((a) => algBoxes[a].checked);

      // ---------------------------------------------------------- Compare

      const compareInput = h('input', { type: 'text', class: 'input mono', placeholder: 'Paste a known hash to compare (any of the above)', 'aria-label': 'Hash to compare', spellcheck: 'false' });
      const compareStatus = h('span', { class: 'meta' });

      // ---------------------------------------------------------- Text

      const textInput = ui.textarea('Type or paste text to hash (hashed as UTF-8)', 'Text to hash', { rows: '4' });
      const textResults = h('div');
      const textMeta = h('span', { class: 'meta' });

      // ---------------------------------------------------------- Files

      const fileInput = h('input', { type: 'file', multiple: true, hidden: true });
      const dropZone = h('div', { class: 'dropzone', tabindex: '0', role: 'button', 'aria-label': 'Choose files to hash' },
        h('strong', null, 'Drop files here'), ' or click to choose. Any size; read in chunks, nothing is uploaded.');
      const fileList = h('div', { class: 'file-jobs' });

      root.append(
        ui.panel('Algorithms', null, options),
        ui.panel('Text', textMeta, textInput, textResults),
        ui.panel('Files', ui.button('Clear finished', clearFinished), dropZone, fileInput, fileList),
        ui.panel('Compare', compareStatus, compareInput));

      // ---------------------------------------------------------- Rendering

      const fmt = (hex) => (state.upper ? hex.toUpperCase() : hex);

      function resultTable(results, label) {
        return ui.table(['Algorithm', 'Hash', ''], results.map(([alg, hex]) => [
          H.NAMES[alg],
          h('code', { class: 'hash', dataset: { hash: hex } }, fmt(hex)),
          ui.copyButton(() => fmt(hex)),
        ]), { 'aria-label': label });
      }

      function allHashesText() {
        const lines = state.textResults.map(([alg, hex]) => `${H.NAMES[alg]}  ${fmt(hex)}  (text)`);
        for (const job of state.files) {
          if (job.results) for (const [alg, hex] of job.results) lines.push(`${H.NAMES[alg]}  ${fmt(hex)}  ${job.file.name}`);
        }
        return lines.join('\n');
      }

      function hashValuesOnly() {
        const set = new Set(state.textResults.map(([, hex]) => hex));
        for (const job of state.files) if (job.results) job.results.forEach(([, hex]) => set.add(hex));
        return [...set].join('\n');
      }

      function runText() {
        const value = textInput.value;
        if (!value) { state.textResults = []; textResults.replaceChildren(); textMeta.textContent = ''; compare(); return; }
        const bytes = C.utf8(value);
        state.textResults = selectedAlgs().map((a) => [a, H.toHex(H.hash(a, bytes))]);
        textMeta.textContent = `${bytes.length} bytes`;
        textResults.replaceChildren(resultTable(state.textResults, 'Text hashes'),
          h('div', { class: 'row actions' }, ui.copyButton(allHashesText, 'Copy all'), ui.sendSelect(hashValuesOnly)));
        compare();
      }

      function addFiles(files) {
        const algs = selectedAlgs();
        if (!algs.length) { ctx.toast('Pick at least one algorithm'); return; }
        for (const file of files) {
          const job = { file, algs, results: null, error: null, done: false, el: h('div', { class: 'file-job' }) };
          state.files.push(job);
          fileList.append(job.el);
        }
        pump();
      }

      // One file at a time keeps memory and CPU use predictable.
      let busy = false;
      async function pump() {
        if (busy) return;
        const job = state.files.find((j) => !j.done && !j.running);
        if (!job) return;
        busy = true;
        job.running = true;
        const started = performance.now();
        const bar = h('progress', { max: String(job.file.size || 1), value: '0' });
        const pct = h('span', { class: 'meta' }, '0%');
        const task = hashFile(job.file, job.algs, (done) => {
          bar.value = done;
          pct.textContent = `${Math.floor((done / (job.file.size || 1)) * 100)}%`;
        });
        job.cancel = task.cancel;
        renderJob(job, h('div', { class: 'row' }, bar, pct, ui.button('Cancel', () => task.cancel())));
        try {
          const { results, mode } = await task.promise;
          job.results = results;
          job.mode = mode;
          job.seconds = (performance.now() - started) / 1000;
        } catch (e) {
          job.error = e.message;
        }
        job.done = true;
        job.running = false;
        renderJob(job);
        compare();
        busy = false;
        pump();
      }

      function renderJob(job, progress) {
        const head = h('div', { class: 'file-job-head' },
          h('strong', null, job.file.name),
          h('span', { class: 'meta' }, formatSize(job.file.size)),
          job.done && job.results ? h('span', { class: 'meta' }, `${job.seconds.toFixed(1)} s · ${job.mode}`) : null);
        const body = [];
        if (progress) body.push(progress);
        if (job.error) body.push(h('p', { class: 'error' }, job.error === 'Cancelled' ? 'Cancelled.' : `Failed: ${job.error}`));
        if (job.results) {
          body.push(resultTable(job.results, `Hashes of ${job.file.name}`));
          body.push(h('div', { class: 'row actions' }, ui.copyButton(allHashesText, 'Copy all'), ui.sendSelect(hashValuesOnly)));
        }
        if (!job.done && !progress) body.push(h('p', { class: 'meta' }, 'Waiting…'));
        job.el.replaceChildren(head, ...body);
      }

      function clearFinished() {
        state.files = state.files.filter((j) => {
          if (j.done) j.el.remove();
          return !j.done;
        });
      }

      // Highlight any hash equal to the one pasted in Compare.
      function compare() {
        const want = compareInput.value.trim().toLowerCase().replace(/^0x/, '');
        let hits = 0;
        for (const code of root.querySelectorAll('code.hash')) {
          const match = want && code.dataset.hash === want;
          code.classList.toggle('match', Boolean(match));
          if (match) hits++;
        }
        if (!want) compareStatus.textContent = '';
        else if (!/^[0-9a-f]+$/.test(want)) compareStatus.textContent = 'Not a hex hash';
        else compareStatus.textContent = hits ? `✓ Match (${hits})` : '✗ No match';
        compareStatus.className = want ? (hits ? 'meta ok' : 'meta err') : 'meta';
      }

      function rerenderAll() {
        state.upper = upperBox.checked;
        runText();
        state.files.filter((j) => j.done).forEach((j) => renderJob(j));
        compare();
      }

      // ---------------------------------------------------------- Events

      textInput.addEventListener('input', ui.debounce(runText, 120));
      for (const box of Object.values(algBoxes)) box.addEventListener('change', runText);
      upperBox.addEventListener('change', rerenderAll);
      compareInput.addEventListener('input', compare);
      dropZone.addEventListener('click', () => fileInput.click());
      dropZone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
      fileInput.addEventListener('change', () => { addFiles([...fileInput.files]); fileInput.value = ''; });
      ui.onFileDrop(dropZone, addFiles);

      return {
        receive(text) { textInput.value = text; runText(); },
        focus() { textInput.focus(); },
      };
    },
  });

  function formatSize(n) {
    if (n < 1024) return `${n} B`;
    if (n < 1048576) return `${(n / 1024).toFixed(1)} KB`;
    if (n < 1073741824) return `${(n / 1048576).toFixed(1)} MB`;
    return `${(n / 1073741824).toFixed(2)} GB`;
  }
})();
</script>
<script>
/*
 * IOC Extractor module: pull indicators out of pasted text or a log file,
 * dedupe and count them, filter, and export as text, CSV or JSON.
 */
(function () {
  'use strict';

  const I = window.OAT.ioc;
  const AUTO_LIMIT = 1024 * 1024;   // above this many characters, extraction waits for a click

  window.OAT.register({
    id: 'ioc',
    name: 'IOC Extractor',
    summary: 'Pull IPs, domains, URLs, emails, hashes, CVE IDs and ATT&CK technique IDs from text or a log. Defanged input is refanged first.',

    render(root, ctx) {
      const { h, ui } = ctx;
      let items = [];
      const hiddenTypes = new Set();

      const input = ui.textarea('Paste a log, alert, email or report, or drop a text file', 'Text to extract from');
      const inputMeta = h('span', { class: 'meta' });
      const runBtn = h('button', { type: 'button', class: 'btn btn-primary btn-small', hidden: true, onclick: run }, 'Extract');
      const fileInput = h('input', { type: 'file', hidden: true });

      const opt = (label, checked = false) => {
        const box = h('input', { type: 'checkbox', checked });
        return { box, el: h('label', { class: 'check' }, box, label) };
      };
      const optRefang = opt('Refang input first', true);
      const optHidePrivate = opt('Hide private and reserved IPs');
      const optFileLike = opt('Include file-like domains (.zip, .mov, .py…)');
      const optDefang = opt('Defang output');

      const typeFilters = h('div', { class: 'row type-filters', role: 'group', 'aria-label': 'Show types' });
      const results = h('div');
      const resultMeta = h('span', { class: 'meta' });

      const inputPanel = ui.panel('Input', [inputMeta, runBtn, ui.button('Open file…', () => fileInput.click()), ui.button('Clear', () => { input.value = ''; run(); })],
        input, fileInput,
        h('div', { class: 'row options' }, optRefang.el, optHidePrivate.el, optFileLike.el, optDefang.el));
      const resultPanel = ui.panel('Indicators', [resultMeta,
        ui.copyButton(() => visible().map(display).join('\n'), 'Copy'),
        ui.button('CSV', exportCsv), ui.button('JSON', exportJson),
        ui.sendSelect(() => visible().map(display).join('\n'))],
        typeFilters, results);
      root.append(inputPanel, resultPanel);

      // ---------------------------------------------------------- Logic

      const display = (it) => (optDefang.box.checked ? I.defang(it.value, { fileLike: true }).text : it.value);

      function visible() {
        return items.filter((it) => !hiddenTypes.has(it.type) && !(optHidePrivate.box.checked && it.note && (it.type === 'ipv4' || it.type === 'ipv6')));
      }

      function run() {
        items = input.value ? I.extract(input.value, { refangFirst: optRefang.box.checked, fileLike: optFileLike.box.checked }) : [];
        runBtn.hidden = true;
        render();
      }

      function render() {
        const counts = {};
        for (const it of items) counts[it.type] = (counts[it.type] || 0) + 1;
        typeFilters.replaceChildren(...I.TYPES.filter((t) => counts[t.id]).map((t) => {
          const box = h('input', { type: 'checkbox', checked: !hiddenTypes.has(t.id) });
          box.addEventListener('change', () => { if (box.checked) hiddenTypes.delete(t.id); else hiddenTypes.add(t.id); render(); });
          return h('label', { class: 'check chip-check' }, box, `${t.label} (${counts[t.id]})`);
        }));

        const list = visible();
        const hidden = items.length - list.length;
        resultMeta.textContent = items.length ? `${list.length} shown${hidden ? `, ${hidden} hidden` : ''}` : '';
        if (!items.length) {
          results.replaceChildren(h('p', { class: 'meta' }, input.value ? 'No indicators found.' : 'Indicators appear here.'));
          return;
        }
        const label = Object.fromEntries(I.TYPES.map((t) => [t.id, t.label]));
        results.replaceChildren(ui.table(['Type', 'Indicator', 'Count', 'Note', ''], list.map((it) => [
          label[it.type],
          h('code', { class: 'ioc-value' }, display(it)),
          String(it.count),
          it.note ? h('span', { class: 'badge badge-info' }, it.note) : '',
          h('span', { class: 'row nowrap' },
            ui.copyButton(() => display(it)),
            it.type !== 'email' ? ui.button('Look up', () => ctx.sendTo('lookup', it.value)) : null),
        ]), { 'aria-label': 'Extracted indicators' }));
      }

      // Values that start with = + - @ are prefixed with ' so spreadsheets do not run them as formulas.
      function csvCell(v) {
        let s = String(v);
        if (/^[=+\-@\t\r]/.test(s)) s = `'${s}`;
        return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
      }

      function exportCsv() {
        const rows = [['type', 'value', 'count', 'note'], ...visible().map((it) => [it.type, display(it), it.count, it.note || ''])];
        ctx.download('iocs.csv', rows.map((r) => r.map(csvCell).join(',')).join('\r\n') + '\r\n', 'text/csv;charset=utf-8');
      }

      function exportJson() {
        const data = visible().map((it) => ({ type: it.type, value: display(it), count: it.count, ...(it.note ? { note: it.note } : {}) }));
        ctx.download('iocs.json', JSON.stringify(data, null, 2), 'application/json');
      }

      function onInput() {
        inputMeta.textContent = input.value ? `${input.value.length.toLocaleString()} characters` : '';
        if (input.value.length > AUTO_LIMIT) { runBtn.hidden = false; return; }
        run();
      }

      async function loadFile(file) {
        const text = await ui.readTextFile(file);
        if (text === null) return;
        input.value = text;
        onInput();
      }

      input.addEventListener('input', ui.debounce(onInput, 250));
      for (const o of [optRefang, optFileLike]) o.box.addEventListener('change', run);
      for (const o of [optHidePrivate, optDefang]) o.box.addEventListener('change', render);
      fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); fileInput.value = ''; });
      ui.onFileDrop(input, (files) => loadFile(files[0]));

      render();

      return {
        receive(text) { input.value = text; onInput(); },
        focus() { input.focus(); },
      };
    },
  });
})();
</script>
<script>
/*
 * Defang / Refang module: make indicators safe to paste into tickets, emails and
 * reports (hxxps[://]evil[.]com), or turn defanged text back into the real thing.
 * Only indicators are changed; the rest of the text is left exactly as it was.
 */
(function () {
  'use strict';

  const I = window.OAT.ioc;

  window.OAT.register({
    id: 'defang',
    name: 'Defang / Refang',
    summary: 'Defang URLs, domains, IPs and emails for tickets and reports (example[.]com, hxxps://), or refang them back.',

    render(root, ctx) {
      const { h, ui } = ctx;
      let mode = 'defang';

      const input = ui.textarea('Paste text containing URLs, domains, IPs or email addresses', 'Text to convert');
      const output = h('pre', { class: 'output', tabindex: '0', 'aria-label': 'Result', 'aria-live': 'polite', 'data-empty': 'Result appears here' });
      const meta = h('span', { class: 'meta' });
      const fileLikeBox = h('input', { type: 'checkbox' });

      const btnDefang = h('button', { type: 'button', 'aria-pressed': 'true', onclick: () => setMode('defang') }, 'Defang');
      const btnRefang = h('button', { type: 'button', 'aria-pressed': 'false', onclick: () => setMode('refang') }, 'Refang');
      const fileLikeLabel = h('label', { class: 'check' }, fileLikeBox, 'Also defang file-like domains (.zip, .mov…)');

      root.append(
        ui.panel('Input', [h('span', { class: 'seg', role: 'group', 'aria-label': 'Direction' }, btnDefang, btnRefang)],
          input, h('div', { class: 'row options' }, fileLikeLabel)),
        ui.panel('Result', [meta, ui.copyButton(() => output.textContent),
          ui.button('Download', () => ctx.download(`${mode}ed.txt`, output.textContent, 'text/plain;charset=utf-8')),
          ui.sendSelect(() => output.textContent)], output));

      function setMode(m) {
        mode = m;
        btnDefang.setAttribute('aria-pressed', String(m === 'defang'));
        btnRefang.setAttribute('aria-pressed', String(m === 'refang'));
        fileLikeLabel.hidden = m !== 'defang';
        run();
      }

      function run() {
        const text = input.value;
        if (!text) { output.textContent = ''; meta.textContent = ''; return; }
        if (mode === 'defang') {
          const r = I.defang(text, { fileLike: fileLikeBox.checked });
          output.textContent = r.text;
          meta.textContent = `${r.count} indicator${r.count === 1 ? '' : 's'} defanged`;
        } else {
          const r = I.refang(text);
          output.textContent = r;
          meta.textContent = r === text ? 'Nothing to refang' : 'Refanged';
        }
      }

      input.addEventListener('input', ui.debounce(run, 120));
      fileLikeBox.addEventListener('change', run);

      return {
        receive(text) { input.value = text; run(); },
        focus() { input.focus(); },
      };
    },
  });
})();
</script>
<script>
/*
 * JWT Decoder module: header, payload, readable time claims, risk flags, and an
 * optional local HMAC signature check. The token never leaves the page.
 */
(function () {
  'use strict';

  const J = window.OAT.jwt;
  const T = window.OAT.time;
  const H = window.OAT.hashes;

  window.OAT.register({
    id: 'jwt',
    name: 'JWT Decoder',
    summary: 'Decode a JSON Web Token: header, payload, readable dates, and flags such as alg "none", expiry and remote keys. Optional HMAC check with your secret.',

    render(root, ctx) {
      const { h, ui } = ctx;
      let decoded = null;

      const input = ui.textarea('Paste a JWT (eyJ…), with or without "Bearer "', 'Token', { rows: '4' });
      const errorBox = h('p', { class: 'notice', hidden: true });
      const findingsBox = h('div');
      const headerOut = h('pre', { class: 'output json', tabindex: '0', 'aria-label': 'Header' });
      const payloadOut = h('pre', { class: 'output json', tabindex: '0', 'aria-label': 'Payload' });
      const timesBox = h('div');
      const sigMeta = h('p', { class: 'meta' });

      const secretInput = h('input', { type: 'password', class: 'input mono', autocomplete: 'off', spellcheck: 'false', placeholder: 'Shared secret', 'aria-label': 'Secret' });
      const showSecret = h('input', { type: 'checkbox' });
      const b64Secret = h('input', { type: 'checkbox' });
      const verifyResult = h('span', { class: 'meta' });

      const resultsWrap = h('div', { hidden: true },
        ui.panel('Findings', null, findingsBox),
        h('div', { class: 'grid-2' },
          ui.panel('Header', ui.copyButton(() => headerOut.textContent), headerOut),
          ui.panel('Payload', [ui.copyButton(() => payloadOut.textContent), ui.sendSelect(() => payloadOut.textContent)], payloadOut)),
        ui.panel('Time claims', null, timesBox),
        ui.panel('Signature', null, sigMeta,
          h('div', { class: 'row' }, secretInput,
            h('label', { class: 'check' }, showSecret, 'Show'),
            h('label', { class: 'check' }, b64Secret, 'Secret is Base64'),
            ui.button('Verify', verify), verifyResult),
          h('p', { class: 'meta' }, 'HS256/384/512 only. The check runs in this page; the secret is never stored.')));

      root.append(ui.panel('Token', ui.button('Clear', () => { input.value = ''; run(); }), input, errorBox), resultsWrap);

      function run() {
        verifyResult.textContent = '';
        verifyResult.className = 'meta';
        const value = input.value.trim();
        decoded = null;
        if (!value) { errorBox.hidden = true; resultsWrap.hidden = true; return; }
        try {
          decoded = J.decode(value);
        } catch (e) {
          errorBox.textContent = e.message;
          errorBox.hidden = false;
          resultsWrap.hidden = true;
          return;
        }
        errorBox.hidden = true;
        resultsWrap.hidden = false;

        findingsBox.replaceChildren(ui.findings(decoded.findings));
        headerOut.textContent = JSON.stringify(decoded.header, null, 2);
        payloadOut.textContent = decoded.payload ? JSON.stringify(decoded.payload, null, 2) : '(encrypted)';

        timesBox.replaceChildren(decoded.times.length
          ? ui.table(['Claim', 'Value', 'UTC', 'Relative'], decoded.times.map((t) => {
            const ticks = BigInt(Math.round(t.seconds * 1000)) * 10000n;
            return [t.claim, String(t.seconds), T.toIso(ticks), T.relative(ticks)];
          }))
          : h('p', { class: 'meta' }, 'No time claims.'));

        const alg = decoded.header.alg || '?';
        sigMeta.textContent = decoded.signature.length
          ? `alg ${alg} · ${decoded.signature.length}-byte signature · ${H.toHex(decoded.signature).slice(0, 32)}${decoded.signature.length > 16 ? '…' : ''}`
          : `alg ${alg} · no signature`;
      }

      function verify() {
        if (!decoded) return;
        try {
          const ok = J.verifyHmac(input.value, secretInput.value, { secretIsBase64: b64Secret.checked });
          verifyResult.textContent = ok ? '✓ Signature valid with this secret' : '✗ Signature does not match this secret';
          verifyResult.className = ok ? 'meta ok' : 'meta err';
        } catch (e) {
          verifyResult.textContent = e.message;
          verifyResult.className = 'meta err';
        }
      }

      input.addEventListener('input', ui.debounce(run, 120));
      showSecret.addEventListener('change', () => { secretInput.type = showSecret.checked ? 'text' : 'password'; });
      secretInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') verify(); });

      return {
        receive(text) { input.value = text; run(); },
        focus() { input.focus(); },
      };
    },
  });
})();
</script>
<script>
/*
 * Timestamp Converter module: recognise Unix (s/ms/µs/ns), Windows FILETIME /
 * LDAP, Chrome/WebKit, Apple Cocoa and date strings; show UTC and a chosen time
 * zone side by side (Africa/Kigali by default), and convert to every format.
 */
(function () {
  'use strict';

  const T = window.OAT.time;
  const DEFAULT_ZONE = 'Africa/Kigali';
  const FALLBACK_ZONES = ['UTC', 'Africa/Kigali', 'Africa/Nairobi', 'Africa/Johannesburg', 'Africa/Lagos', 'Europe/London',
    'Europe/Paris', 'Europe/Berlin', 'America/New_York', 'America/Chicago', 'America/Los_Angeles', 'Asia/Dubai',
    'Asia/Kolkata', 'Asia/Singapore', 'Asia/Tokyo', 'Australia/Sydney'];

  window.OAT.register({
    id: 'time',
    name: 'Timestamp Converter',
    summary: 'Unix seconds/ms/µs, Windows FILETIME and LDAP/AD time, Chrome/WebKit, Apple Cocoa, ISO 8601 and email dates. UTC and your time zone side by side.',

    render(root, ctx) {
      const { h, ui } = ctx;
      let readings = [];
      let selected = 0;

      const input = h('input', { type: 'text', class: 'input mono big', spellcheck: 'false', autocomplete: 'off',
        placeholder: 'e.g. 1700000000, 133444736000000000, 0x01DA1747C66D0000, 2026-10-07 14:00:00', 'aria-label': 'Timestamp' });

      const zones = typeof Intl.supportedValuesOf === 'function' ? Intl.supportedValuesOf('timeZone') : FALLBACK_ZONES;
      const zoneSelect = h('select', { 'aria-label': 'Time zone' },
        h('option', { value: Intl.DateTimeFormat().resolvedOptions().timeZone }, `Browser (${Intl.DateTimeFormat().resolvedOptions().timeZone})`),
        zones.map((z) => h('option', { value: z }, z)));
      zoneSelect.value = DEFAULT_ZONE;
      if (zoneSelect.value !== DEFAULT_ZONE) zoneSelect.selectedIndex = 0;

      const readingsBox = h('div', { class: 'readings' });
      const convBox = h('div');

      root.append(
        ui.panel('Input', [h('label', { class: 'row' }, 'Time zone', zoneSelect), ui.button('Now', () => { input.value = String(Math.floor(Date.now() / 1000)); run(); })],
          input),
        ui.panel('Readings', null, readingsBox),
        ui.panel('Convert to', null, convBox));

      function run() {
        readings = input.value.trim() ? T.interpret(input.value) : [];
        selected = 0;
        render();
      }

      function render() {
        const zone = zoneSelect.value;
        if (!input.value.trim()) {
          readingsBox.replaceChildren(h('p', { class: 'meta' }, 'Enter a timestamp, or press Now.'));
          convBox.replaceChildren();
          return;
        }
        if (!readings.length) {
          readingsBox.replaceChildren(h('p', { class: 'notice' }, 'Not a recognised timestamp, or outside 1970–2100.'));
          convBox.replaceChildren();
          return;
        }
        const card = (r, i) => h('button', {
          type: 'button', class: 'reading', 'aria-pressed': String(i === selected),
          onclick: () => { selected = i; render(); },
        },
        h('span', { class: 'reading-label' }, r.label),

<script>
/*
 * Email Header Analyzer module: paste raw headers (or drop a .eml) and see the
 * relay path, recorded authentication results, sender mismatches and the
 * originating IP. Nothing is re-checked online.
 */
(function () {
  'use strict';

  const E = window.OAT.email;

  window.OAT.register({
    id: 'email',
    name: 'Email Header Analyzer',
    summary: 'Relay path with delays, SPF/DKIM/DMARC as recorded by the receiving server, From / Reply-To / Return-Path mismatches and the originating IP.',

    render(root, ctx) {
      const { h, ui } = ctx;

      const input = ui.textarea('Paste the raw headers (Outlook: File › Properties › Internet headers; Gmail: Show original), or drop a .eml file', 'Raw email headers');
      const fileInput = h('input', { type: 'file', accept: '.eml,.txt,message/rfc822', hidden: true });
      const out = h('div');

      root.append(
        ui.panel('Headers', [ui.button('Open .eml…', () => fileInput.click()), ui.button('Clear', () => { input.value = ''; run(); })],
          input, fileInput,
          h('p', { class: 'meta' }, 'SPF, DKIM and DMARC are shown as the receiving server recorded them. They cannot be re-verified offline (that needs DNS).')),
        out);

      function badgeFor(result) {
        const level = result === 'pass' ? 'pass' : ['fail', 'softfail', 'permerror', 'temperror'].includes(result) ? 'high' : 'info';

<script>
/*
 * URL Analyzer module: unwrap redirect layers (SafeLinks, Proofpoint, Google…),
 * show each URL's parts and flag look-alike domains, obfuscated IPs and tricks.
 * Nothing is fetched: the analysis is purely on the text of the URL.
 */
(function () {
  'use strict';

  const U = window.OAT.url;
  const I = window.OAT.ioc;

  window.OAT.register({
    id: 'url',
    name: 'URL Analyzer',

    render(root, ctx) {
      const { h, ui } = ctx;

      const input = ui.textarea('Paste a URL (defanged is fine), e.g. a SafeLinks or Proofpoint link from a phishing email', 'URL', { rows: '3' });
      const out = h('div');
      root.append(ui.panel('URL', ui.button('Clear', () => { input.value = ''; run(); }), input), out);

      function partsList(p) {
        const rows = [

        receive(text) { input.value = text.trim().split(/\s*\n/)[0]; run(); },

<script>
/*
 * Text Diff module: compare two configs, scripts or logs side by side, with
 * word-level highlights, and export a unified .diff.
 */
(function () {
  'use strict';

  const D = window.OAT.diff;
  const BIG = 3000;          // rows above this: show only changes with context
  const CONTEXT = 3;

  window.OAT.register({
    id: 'diff',
    name: 'Text Diff',
    summary: 'Compare two configs, scripts or logs side by side with word-level highlights. Ignore whitespace or case; export a unified .diff.',

    render(root, ctx) {
      const { h, ui } = ctx;
      let last = null;

      const left = ui.textarea('Original (paste or drop a file)', 'Original text', { rows: '10' });
      const right = ui.textarea('Changed (paste or drop a file)', 'Changed text', { rows: '10' });
      const leftName = h('span', { class: 'meta' }, '');
      const rightName = h('span', { class: 'meta' }, '');
      const ignoreWs = h('input', { type: 'checkbox' });
      const ignoreCase = h('input', { type: 'checkbox' });
      const onlyChanges = h('input', { type: 'checkbox' });
      const stats = h('span', { class: 'meta' });
      const view = h('div', { class: 'diff-view' });

      const pane = (title, ta, nameEl) => {
        const fileInput = h('input', { type: 'file', hidden: true });
        fileInput.addEventListener('change', () => { if (fileInput.files[0]) load(fileInput.files[0], ta, nameEl); fileInput.value = ''; });
        ui.onFileDrop(ta, (files) => load(files[0], ta, nameEl));
        return ui.panel(title, [nameEl, ui.button('Open file…', () => fileInput.click())], ta, fileInput);
      };

      root.append(
        h('div', { class: 'grid-2' }, pane('Original', left, leftName), pane('Changed', right, rightName)),
        h('div', { class: 'row options panel-lite' },
          h('label', { class: 'check' }, ignoreWs, 'Ignore whitespace'),
          h('label', { class: 'check' }, ignoreCase, 'Ignore case'),
          h('label', { class: 'check' }, onlyChanges, 'Only show changes'),
          ui.button('Swap', () => { [left.value, right.value] = [right.value, left.value]; [leftName.textContent, rightName.textContent] = [rightName.textContent, leftName.textContent]; run(); })),
        ui.panel('Differences', [stats, ui.copyButton(unifiedText, 'Copy .diff'),
          ui.button('Download .diff', () => ctx.download('changes.diff', unifiedText(), 'text/x-diff;charset=utf-8'))], view));

      async function load(file, ta, nameEl) {
        const text = await ui.readTextFile(file);
        if (text === null) return;
        ta.value = text;
        nameEl.textContent = file.name;
        run();
      }

      function unifiedText() {
        return last ? D.unified(last, { nameA: leftName.textContent || 'original', nameB: rightName.textContent || 'changed' }) : '';
      }

      function cell(side, row) {
        const line = row[side];
        if (!line) return [h('td', { class: 'ln' }), h('td', { class: 'code empty' })];
        const code = h('td', { class: 'code' });
        if (row.type === 'change' && line.text.length < 2000 && row.left.text.length < 2000 && row.right.text.length < 2000) {
          for (const part of D.wordDiff(row.left.text, row.right.text)) {
            if (part.op === '=') code.append(part.text);
            else if ((part.op === '-' && side === 'left') || (part.op === '+' && side === 'right')) code.append(h('mark', null, part.text));
          }
        } else {
          code.textContent = line.text;
        }
        return [h('td', { class: 'ln' }, String(line.n)), code];
      }

      function run() {
        if (!left.value && !right.value) { last = null; view.replaceChildren(h('p', { class: 'meta' }, 'Paste two texts to compare.')); stats.textContent = ''; return; }
        last = D.diffText(left.value, right.value, { ignoreWhitespace: ignoreWs.checked, ignoreCase: ignoreCase.checked });
        const rows = D.sideBySide(last);
        stats.textContent = last.added || last.removed ? `+${last.added} −${last.removed} lines` : 'Identical';
        if (!last.added && !last.removed) { view.replaceChildren(h('p', { class: 'meta ok' }, '✓ No differences.')); return; }

        // Collapse long unchanged stretches when asked, or when the diff is big.
        const collapse = onlyChanges.checked || rows.length > BIG;
        const keep = new Uint8Array(rows.length);
        rows.forEach((r, i) => { if (r.type !== 'equal') for (let j = Math.max(0, i - CONTEXT); j <= Math.min(rows.length - 1, i + CONTEXT); j++) keep[j] = 1; });

        const tbody = h('tbody');
        let skipped = 0;
        const flushSkip = () => {
          if (skipped) tbody.append(h('tr', { class: 'skip' }, h('td', { colspan: '4' }, `… ${skipped} unchanged line${skipped === 1 ? '' : 's'} …`)));
          skipped = 0;
        };
        rows.forEach((r, i) => {
          if (collapse && !keep[i]) { skipped++; return; }
          flushSkip();
          tbody.append(h('tr', { class: `row-${r.type}` }, ...cell('left', r), ...cell('right', r)));
        });
        flushSkip();
        view.replaceChildren(...[
          last.tooDifferent ? h('p', { class: 'notice' }, 'The texts are too different for a line-by-line match; showing them as fully replaced.') : null,
          h('div', { class: 'table-wrap' }, h('table', { class: 'diff' }, tbody)),
        ].filter(Boolean));
      }

      const rerun = ui.debounce(run, 250);
      for (const el of [left, right]) el.addEventListener('input', rerun);
      for (const el of [ignoreWs, ignoreCase, onlyChanges]) el.addEventListener('change', run);
      run();

      return {
        receive(text) { if (!left.value) left.value = text; else right.value = text; run(); },
        focus() { left.focus(); },
      };
    },
  });
})();
</script>
<script>
/*
 * Regex Tester module: test a pattern against sample logs with highlighted
 * matches, groups and replace. Matching runs in a Web Worker with a time limit,
 * so a catastrophic-backtracking pattern cannot freeze the page.
 */
(function () {
  'use strict';

  const R = window.OAT.regex;
  const TIMEOUT_MS = 2000;
  const HIGHLIGHT_LIMIT = 500000;   // characters rendered with highlights

  const WORKER_SOURCE = `'use strict';
const R = ${R.factorySource}();
self.onmessage = (e) => {
  const { id, pattern, flags, text, replacement } = e.data;
  self.postMessage({ id, result: R.run(pattern, flags, text, { replacement }) });
};`;

  let workerUrl = null;
  function newWorker() {
    try {
      if (!workerUrl) workerUrl = URL.createObjectURL(new Blob([WORKER_SOURCE], { type: 'text/javascript' }));
      return new Worker(workerUrl);
    } catch (_) {
      return null;
    }
  }

  window.OAT.register({
    id: 'regex',
    name: 'Regex Tester',
    summary: 'Test JavaScript regular expressions against sample logs: highlighted matches, capture groups, replace, and ready-made SOC patterns. Runs with a time limit.',

    render(root, ctx) {
      const { h, ui } = ctx;
      let worker = null;
      let seq = 0;
      let timer = null;
      let lastResult = null;

      const pattern = h('input', { type: 'text', class: 'input mono big', spellcheck: 'false', autocomplete: 'off', placeholder: 'Pattern, e.g. (?<ip>\\d+\\.\\d+\\.\\d+\\.\\d+)', 'aria-label': 'Regular expression' });
      const flagBoxes = Object.fromEntries(['g', 'i', 'm', 's', 'u'].map((f) => [f, h('input', { type: 'checkbox', checked: f === 'g' })]));
      const flagHelp = { g: 'global', i: 'ignore case', m: 'multiline ^$', s: 'dot matches newline', u: 'unicode' };
      const presets = h('select', { 'aria-label': 'Preset patterns' }, h('option', { value: '' }, 'Presets…'), R.PRESETS.map((p, i) => h('option', { value: String(i) }, p.name)));
      const text = ui.textarea('Sample text or log lines to test against', 'Test text', { rows: '8' });
      const replaceOn = h('input', { type: 'checkbox' });
      const replacement = h('input', { type: 'text', class: 'input mono', placeholder: 'Replacement, e.g. [$1] or $<ip>', 'aria-label': 'Replacement', disabled: true });
      const status = h('span', { class: 'meta' });
      const highlighted = h('pre', { class: 'output', tabindex: '0', 'aria-label': 'Text with matches highlighted' });
      const matchesBox = h('div');
      const replacedOut = h('pre', { class: 'output', tabindex: '0', 'aria-label': 'Replaced text', hidden: true });

      root.append(
        ui.panel('Pattern', [presets],
          h('div', { class: 'row' }, h('span', { class: 'mono slash' }, '/'), pattern, h('span', { class: 'mono slash' }, '/')),
          h('div', { class: 'row options' }, Object.entries(flagBoxes).map(([f, box]) => h('label', { class: 'check', title: flagHelp[f] }, box, h('code', null, f), h('span', { class: 'meta' }, flagHelp[f])))),
          h('p', { class: 'meta' }, 'JavaScript regex flavour: close to PCRE, but no possessive quantifiers or atomic groups, and lookbehind must be fixed-width in other engines.')),
        ui.panel('Test text', [h('label', { class: 'check' }, replaceOn, 'Replace'), replacement], text),
        ui.panel('Matches', [status, ui.copyButton(() => (lastResult ? lastResult.matches.map((m) => m.text).join('\n') : ''), 'Copy matches'),
          ui.sendSelect(() => (lastResult ? lastResult.matches.map((m) => m.text).join('\n') : ''))],
          highlighted, replacedOut, matchesBox));

      function flags() { return Object.entries(flagBoxes).filter(([, b]) => b.checked).map(([f]) => f).join(''); }

      function run() {
        clearTimeout(timer);
        if (!pattern.value) { show({ matches: [] }, true); status.textContent = ''; return; }
        if (!worker) worker = newWorker();
        const msg = { id: ++seq, pattern: pattern.value, flags: flags(), text: text.value, replacement: replaceOn.checked ? replacement.value : null };
        if (!worker) { show(R.run(msg.pattern, msg.flags, msg.text, { replacement: msg.replacement })); return; }   // no workers: run inline
        status.textContent = 'Running…';
        worker.onmessage = (e) => { if (e.data.id === seq) { clearTimeout(timer); show(e.data.result); } };
        worker.onerror = (e) => {   // worker could not start (e.g. blocked by policy): run inline instead
          e.preventDefault();
          clearTimeout(timer);
          worker = null;
          show(R.run(msg.pattern, msg.flags, msg.text, { replacement: msg.replacement }));
        };
        timer = setTimeout(() => {
          worker.terminate();
          worker = null;
          status.textContent = '';
          matchesBox.replaceChildren(h('p', { class: 'notice' }, `Stopped after ${TIMEOUT_MS / 1000} s: the pattern is probably backtracking catastrophically (nested quantifiers like (a+)+ are the usual cause).`));
          highlighted.textContent = text.value.slice(0, HIGHLIGHT_LIMIT);
        }, TIMEOUT_MS);
        worker.postMessage(msg);
      }

      function show(result, empty = false) {
        lastResult = result;
        if (result.error) {
          status.textContent = '';
          matchesBox.replaceChildren(h('p', { class: 'notice' }, result.error));
          highlighted.textContent = text.value.slice(0, HIGHLIGHT_LIMIT);
          replacedOut.hidden = true;
          return;
        }
        const ms = result.matches;
        if (!empty) status.textContent = `${ms.length}${result.truncated ? '+' : ''} match${ms.length === 1 ? '' : 'es'}`;

        // Highlight: alternate plain text nodes and <mark> elements.
        const t = text.value.slice(0, HIGHLIGHT_LIMIT);
        const frag = document.createDocumentFragment();
        let pos = 0;
        for (const m of ms) {
          if (m.index >= t.length) break;
          if (m.index > pos) frag.append(t.slice(pos, m.index));
          frag.append(h('mark', { class: m.text ? '' : 'empty-match' }, m.text || '​'));
          pos = Math.max(pos, m.end);
        }
        frag.append(t.slice(pos));
        highlighted.replaceChildren(frag);

        replacedOut.hidden = result.replaced === undefined;
        if (result.replaced !== undefined) replacedOut.textContent = result.replaced;

        const groupCount = ms.length ? ms[0].groups.length : 0;
        const named = ms.length && ms[0].named ? Object.keys(ms[0].named) : [];
        matchesBox.replaceChildren(ms.length
          ? ui.table(['#', 'Index', 'Match', ...Array.from({ length: groupCount }, (_, i) => named[i] ? `$${i + 1} (${named[i]})` : `$${i + 1}`)],
            ms.slice(0, 1000).map((m, i) => [String(i + 1), String(m.index), h('code', null, m.text), ...m.groups.map((g) => (g === undefined ? h('span', { class: 'meta' }, '—') : h('code', null, g)))]))
          : h('p', { class: 'meta' }, empty ? '' : 'No matches.'));
      }

      presets.addEventListener('change', () => {
        const p = R.PRESETS[Number(presets.value)];
        presets.value = '';
        if (!p) return;
        pattern.value = p.pattern;
        for (const [f, box] of Object.entries(flagBoxes)) box.checked = p.flags.includes(f);
        run();
      });
      const rerun = ui.debounce(run, 200);
      for (const el of [pattern, text, replacement]) el.addEventListener('input', rerun);
      for (const box of Object.values(flagBoxes)) box.addEventListener('change', run);
      replaceOn.addEventListener('change', () => { replacement.disabled = !replaceOn.checked; run(); });

      return {
        receive(value) { text.value = value; run(); },
        focus() { pattern.focus(); },
      };
    },
  });
})();
</script>
<script>
/*
 * Entropy / Strings module: is this file packed or encrypted? What readable
 * strings are inside it? Which values in a list look random (DGA domains)?
 */
(function () {
  'use strict';

  const E = window.OAT.entropy;
  const C = window.OAT.codecs;
  const H = window.OAT.hashes;
  const MAX_FILE = 200 * 1024 * 1024;
  const SHOW_STRINGS = 2000;
  const SVG_NS = 'http://www.w3.org/2000/svg';

  window.OAT.register({
    id: 'entropy',
    name: 'Entropy / Strings',
    summary: 'Shannon entropy of a file or text (packed? encrypted?), an entropy profile, ASCII and UTF-16 strings with offsets, and per-line entropy for spotting random-looking domains.',

    render(root, ctx) {
      const { h, ui } = ctx;
      let bytes = null;
      let fileName = '';
      let found = [];

      const fileInput = h('input', { type: 'file', hidden: true });
      const drop = h('div', { class: 'dropzone', tabindex: '0', role: 'button', 'aria-label': 'Choose a file to analyse' },
        h('strong', null, 'Drop a file here'), ' or click to choose (up to 200 MB). Read locally; nothing is uploaded.');
      const textIn = ui.textarea('…or paste text. One value per line gives a per-line entropy ranking (e.g. domains from DNS logs).', 'Text', { rows: '5' });

      const summary = h('div');
      const chart = h('div', { class: 'entropy-chart' });
      const minLen = h('input', { type: 'number', class: 'input narrow', min: '3', max: '64', value: '6', 'aria-label': 'Minimum string length' });
      const onlyInteresting = h('input', { type: 'checkbox' });
      const filter = h('input', { type: 'text', class: 'input', placeholder: 'Filter strings', 'aria-label': 'Filter strings' });
      const stringsBox = h('div');
      const stringsMeta = h('span', { class: 'meta' });
      const perLineBox = h('div');

      const filePanels = h('div', { hidden: true },
        ui.panel('Summary', null, summary, chart),
        ui.panel('Strings', [stringsMeta,
          ui.copyButton(() => visibleStrings().map((s) => s.text).join('\n'), 'Copy'),
          ui.button('Download', () => ctx.download(`${fileName || 'data'}.strings.txt`, visibleStrings().map((s) => `${s.offset.toString(16).padStart(8, '0')}  ${s.enc === 'ascii' ? 'A' : 'U'}  ${s.text}`).join('\n'), 'text/plain;charset=utf-8')),
          ui.sendSelect(() => visibleStrings().map((s) => s.text).join('\n'))],
          h('div', { class: 'row options' }, h('label', { class: 'row' }, 'Min length', minLen), h('label', { class: 'check' }, onlyInteresting, 'Only interesting'), filter),
          stringsBox));
      const textPanel = h('div', { hidden: true }, ui.panel('Text entropy', null, perLineBox));

      root.append(ui.panel('Input', [ui.button('Clear', clearAll)], drop, fileInput, textIn), filePanels, textPanel);

      // ---------------------------------------------------------- File analysis

      async function loadFile(file) {
        if (file.size > MAX_FILE) { ctx.toast('File is over 200 MB'); return; }
        bytes = new Uint8Array(await file.arrayBuffer());
        fileName = file.name;
        textIn.value = '';
        textPanel.hidden = true;
        analyseBytes();
      }

      function analyseBytes() {
        const h0 = E.shannon(bytes);
        // At least 1 KB per block: on fewer samples even random data measures below 7.2 bits/byte.
        const blockSize = bytes.length > 64 * 1024 * 1024 ? 65536 : bytes.length > 4 * 1024 * 1024 ? 16384 : bytes.length > 256 * 1024 ? 4096 : 1024;
        const profile = E.blocks(bytes, blockSize);
        const highShare = profile.filter((x) => x >= 7.2).length / (profile.length || 1);
        const kind = C.sniff(bytes);
        summary.replaceChildren(h('dl', { class: 'kv' },
          h('dt', null, 'File'), h('dd', null, `${fileName} · ${formatSize(bytes.length)}${kind ? ` · ${kind}` : ''}`),
          h('dt', null, 'Entropy'), h('dd', null, h('strong', null, `${h0.toFixed(3)} bits/byte`), ` · ${E.verdict(h0)}`),
          h('dt', null, 'High-entropy blocks'), h('dd', null, `${Math.round(highShare * 100)}% of ${profile.length} blocks of ${formatSize(blockSize)} are ≥ 7.2`),
          bytes.length <= 50 * 1024 * 1024 ? [h('dt', null, 'SHA-256'), h('dd', null, h('code', null, H.toHex(H.hash('sha256', bytes))))] : null));
        chart.replaceChildren(renderChart(profile, blockSize));
        found = E.strings(bytes, { min: Number(minLen.value) || 6 });
        for (const s of found.strings) s.why = undefined;
        filePanels.hidden = false;
        renderStrings();
      }

      // Entropy per block as bars (0–8), with the 7.2 "likely packed/encrypted" line.
      function renderChart(profile, blockSize) {
        const width = Math.min(600, profile.length) || 1;
        const per = profile.length / width;
        const svg = document.createElementNS(SVG_NS, 'svg');
        svg.setAttribute('viewBox', `0 0 ${width} 100`);
        svg.setAttribute('preserveAspectRatio', 'none');
        svg.setAttribute('class', 'entropy-svg');
        svg.setAttribute('role', 'img');
        svg.setAttribute('aria-label', 'Entropy per block, 0 to 8 bits per byte');
        for (let x = 0; x < width; x++) {
          let v = 0;
          for (let i = Math.floor(x * per); i < Math.max(Math.floor((x + 1) * per), Math.floor(x * per) + 1) && i < profile.length; i++) v = Math.max(v, profile[i]);
          const r = document.createElementNS(SVG_NS, 'rect');
          r.setAttribute('x', String(x));
          r.setAttribute('width', '1');
          r.setAttribute('y', String(100 - (v / 8) * 100));
          r.setAttribute('height', String((v / 8) * 100));
          r.setAttribute('class', v >= 7.2 ? 'bar-hot' : 'bar');
          svg.append(r);
        }
        const line = document.createElementNS(SVG_NS, 'line');
        for (const [k, v] of Object.entries({ x1: 0, x2: width, y1: 10, y2: 10, class: 'threshold' })) line.setAttribute(k, String(v));
        svg.append(line);
        return h('div', null, svg, h('p', { class: 'meta' }, `Each bar is the highest entropy in its slice of the file (block size ${formatSize(blockSize)}). Dashed line: 7.2 bits/byte; red bars above it are likely compressed or encrypted.`));
      }

      function visibleStrings() {
        const q = filter.value.trim().toLowerCase();
        return found.strings.filter((s) => {
          if (q && !s.text.toLowerCase().includes(q)) return false;
          if (onlyInteresting.checked) {
            if (s.why === undefined) s.why = E.interesting(s.text);
            return Boolean(s.why);
          }
          return true;
        });
      }

      function renderStrings() {
        const list = visibleStrings();
        stringsMeta.textContent = `${list.length.toLocaleString()} of ${found.strings.length.toLocaleString()}${found.truncated ? '+' : ''} strings`;
        const shown = list.slice(0, SHOW_STRINGS);
        stringsBox.replaceChildren(...[
          ui.table(['Offset', 'Enc', 'String', ''], shown.map((s) => {
            if (s.why === undefined) s.why = E.interesting(s.text);
            return [h('code', null, s.offset.toString(16).padStart(8, '0')), s.enc === 'ascii' ? 'ASCII' : 'UTF-16', h('code', { class: 'ioc-value' }, s.text),
              s.why ? h('span', { class: 'badge badge-medium' }, s.why) : ''];
          })),
          list.length > SHOW_STRINGS ? h('p', { class: 'meta' }, `Showing the first ${SHOW_STRINGS.toLocaleString()}. Use the filter, or Download for all.`) : null,
        ].filter(Boolean));
      }

      // ---------------------------------------------------------- Text analysis

      function analyseText() {
        const t = textIn.value;
        if (!t.trim()) { textPanel.hidden = true; return; }
        bytes = null;
        filePanels.hidden = true;
        textPanel.hidden = false;
        const b = C.utf8(t);
        const lines = E.perLine(t);
        perLineBox.replaceChildren(
          h('dl', { class: 'kv' }, h('dt', null, 'Whole text'), h('dd', null, h('strong', null, `${E.shannon(b).toFixed(3)} bits/byte`), ` · ${E.verdict(E.shannon(b))}`)),
          ...(lines.length > 1 ? [
            h('p', { class: 'meta' }, 'Per line, highest first. For domains the TLD is ignored. Random-looking names (DGA, tunnelling) usually score above 3.5 bits/char when 10+ characters long.'),
            ui.table(['Value', 'Length', 'Bits/char'], lines.slice(0, 2000).map((l) => [h('code', { class: 'ioc-value' }, l.line), String(l.length),
              h('span', { class: l.entropy >= 3.5 && l.length >= 10 ? 'badge badge-medium' : '' }, l.entropy.toFixed(2))])),
          ] : []));
      }

      function clearAll() {
        bytes = null; found = []; fileName = ''; textIn.value = '';
        filePanels.hidden = true; textPanel.hidden = true;
      }

      drop.addEventListener('click', () => fileInput.click());
      drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
      fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); fileInput.value = ''; });
      ui.onFileDrop(drop, (files) => loadFile(files[0]));
      textIn.addEventListener('input', ui.debounce(analyseText, 200));
      minLen.addEventListener('change', () => { if (bytes) { found = E.strings(bytes, { min: Math.max(3, Number(minLen.value) || 6) }); renderStrings(); } });
      onlyInteresting.addEventListener('change', renderStrings);
      filter.addEventListener('input', ui.debounce(renderStrings, 150));

      return {
        receive(text) { textIn.value = text; analyseText(); },
        focus() { textIn.focus(); },
      };
    },
  });

  function formatSize(n) {
    if (n < 1024) return `${n} B`;
    if (n < 1048576) return `${(n / 1024).toFixed(1)} KB`;
    return `${(n / 1048576).toFixed(1)} MB`;
  }
})();
</script>
<script>
/*
 * Case Notes module: collect indicators, verdicts, a timeline and notes during
 * an investigation, and export a report (Markdown, HTML or JSON).
 *
 * Nothing is stored unless the analyst ticks "Keep in this browser". Then the
 * case lives in this browser's local storage only (never sent anywhere).
 */
(function () {
  'use strict';

  const CR = window.OAT.casereport;
  const I = window.OAT.ioc;
  const STORE_KEY = 'oat.case.v1';

  const storage = {
    load() { try { const v = localStorage.getItem(STORE_KEY); return v ? CR.fromJson(v) : null; } catch (_) { return null; } },
    save(c) { try { localStorage.setItem(STORE_KEY, CR.toJson(c)); return true; } catch (_) { return false; } },
    clear() { try { localStorage.removeItem(STORE_KEY); } catch (_) { /* nothing stored */ } },
  };

  window.OAT.register({
    id: 'case',
    name: 'Case Notes',
    summary: 'Collect indicators with verdicts, a timeline and notes during an investigation, then export a report. Kept only in this page unless you choose to save it in this browser.',

    render(root, ctx) {
      const { h, ui } = ctx;
      const saved = storage.load();
      let c = saved || CR.emptyCase();

      // ---------------------------------------------------------- Header fields

      const field = (label, key, attrs = {}) => {
        const el = h('input', { type: 'text', class: 'input', value: c[key], 'aria-label': label, ...attrs });
        el.addEventListener('input', () => { c[key] = el.value; changed(); });
        return { el, wrap: h('label', { class: 'field' }, h('span', { class: 'meta' }, label), el), key };
      };
      const fTitle = field('Case title', 'title', { placeholder: 'e.g. Phishing wave targeting finance' });
      const fTicket = field('Ticket / incident ID', 'ticket');
      const fAnalyst = field('Analyst', 'analyst');

      const keepBox = h('input', { type: 'checkbox', checked: Boolean(saved) });
      const keepNote = h('span', { class: 'meta' });

      // ---------------------------------------------------------- IOCs

      const iocIn = ui.textarea('Paste indicators or any text containing them (defanged is fine), then Add', 'Indicators to add', { rows: '3' });
      const iocTable = h('div');

      // ---------------------------------------------------------- Timeline

      const tlTime = h('input', { type: 'datetime-local', class: 'input narrow-time', 'aria-label': 'Event time', step: '1' });
      const tlText = h('input', { type: 'text', class: 'input', placeholder: 'What happened, e.g. "User clicked the link"', 'aria-label': 'Event' });
      const tlList = h('div');

      // ---------------------------------------------------------- Notes

      const notes = ui.textarea('Free notes: hypotheses, findings, next steps…', 'Notes', { rows: '6' });
      notes.value = c.notes;

      const defangBox = h('input', { type: 'checkbox', checked: true });
      const importInput = h('input', { type: 'file', accept: '.json,application/json', hidden: true });

      root.append(
        ui.panel('Case', [h('label', { class: 'check' }, keepBox, 'Keep in this browser'), keepNote],
          h('div', { class: 'grid-3' }, fTitle.wrap, fTicket.wrap, fAnalyst.wrap)),
        ui.panel('Indicators', [ui.button('Add', addIocs), ui.button('Send all to Lookup', () => ctx.sendTo('lookup', c.iocs.map((x) => x.value).join('\n')))], iocIn, iocTable),
        ui.panel('Timeline', null, h('div', { class: 'row' }, tlTime, tlText, ui.button('Add event', addEvent)), tlList),
        ui.panel('Notes', null, notes),
        ui.panel('Report', [h('label', { class: 'check' }, defangBox, 'Defang indicators')],
          h('div', { class: 'row' },
            ui.button('Download Markdown', () => ctx.download(`${slug()}.md`, CR.toMarkdown(c, { defang: defangBox.checked }), 'text/markdown;charset=utf-8')),
            ui.copyButton(() => CR.toMarkdown(c, { defang: defangBox.checked }), 'Copy Markdown'),
            ui.button('Download HTML', () => ctx.download(`${slug()}.html`, CR.toHtml(c, { defang: defangBox.checked }), 'text/html;charset=utf-8')),
            ui.button('Export JSON', () => ctx.download(`${slug()}.json`, CR.toJson(c), 'application/json')),
            ui.button('Import JSON…', () => importInput.click()),
            ui.button('New case', newCase)),
          importInput,
          h('p', { class: 'meta' }, 'Export JSON to keep a case or share it with a colleague; Import JSON to continue it later.')));

      // ---------------------------------------------------------- Behaviour

      function slug() {
        return (c.title || 'case').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'case';
      }

      function changed() {
        if (keepBox.checked) keepNote.textContent = storage.save(c) ? 'Saved' : 'Could not save (storage blocked)';
      }

      function addIocs() {
        const n = CR.addIocsFromText(c, iocIn.value);
        if (!iocIn.value.trim()) return;
        ctx.toast(n ? `Added ${n} indicator${n === 1 ? '' : 's'}` : 'No new indicators found');
        if (n) iocIn.value = '';
        renderIocs();
        changed();
      }

      function renderIocs() {
        const labels = Object.fromEntries(I.TYPES.map((t) => [t.id, t.label]));
        if (!c.iocs.length) { iocTable.replaceChildren(h('p', { class: 'meta' }, 'No indicators yet. Paste above, or use Send to… from another module.')); return; }
        iocTable.replaceChildren(ui.table(['Type', 'Indicator', 'Verdict', 'Note', ''], c.iocs.map((x, i) => {
          const verdict = h('select', { 'aria-label': `Verdict for ${x.value}`, class: `verdict-${x.verdict}` }, CR.VERDICTS.map((v) => h('option', { value: v }, v)));
          verdict.value = x.verdict;
          verdict.addEventListener('change', () => { x.verdict = verdict.value; verdict.className = `verdict-${x.verdict}`; changed(); });
          const note = h('input', { type: 'text', class: 'input', value: x.note, 'aria-label': `Note for ${x.value}` });
          note.addEventListener('input', () => { x.note = note.value; changed(); });
          return [labels[x.type] || x.type, h('code', { class: 'ioc-value' }, x.value), verdict, note,
            h('span', { class: 'row nowrap' }, ui.button('Look up', () => ctx.sendTo('lookup', x.value)),
              ui.button('✕', () => { c.iocs.splice(i, 1); renderIocs(); changed(); }, { 'aria-label': `Remove ${x.value}` }))];
        })));
      }

      function nowLocal() {
        const d = new Date();
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        return d.toISOString().slice(0, 19);
      }

      function addEvent() {
        const text = tlText.value.trim();
        if (!text) { tlText.focus(); return; }
        c.timeline.push({ time: tlTime.value || nowLocal(), text });
        tlText.value = '';
        tlTime.value = nowLocal();
        renderTimeline();
        changed();
      }

      function renderTimeline() {
        const items = c.timeline.map((t, i) => ({ t, i })).sort((a, b) => (a.t.time < b.t.time ? -1 : a.t.time > b.t.time ? 1 : 0));
        tlList.replaceChildren(items.length
          ? ui.table(['Time (local)', 'Event', ''], items.map(({ t, i }) => [h('code', null, t.time.replace('T', ' ')), t.text,
            ui.button('✕', () => { c.timeline.splice(i, 1); renderTimeline(); changed(); }, { 'aria-label': 'Remove event' })]))
          : h('p', { class: 'meta' }, 'No events yet.'));
      }

      function renderAll() {
        for (const f of [fTitle, fTicket, fAnalyst]) f.el.value = c[f.key];
        notes.value = c.notes;
        renderIocs();
        renderTimeline();
      }

      function newCase() {
        if ((c.iocs.length || c.timeline.length || c.notes) && !window.confirm('Start a new case? The current one is cleared (export it first if you need it).')) return;
        c = CR.emptyCase();
        changed();
        renderAll();
      }

      keepBox.addEventListener('change', () => {
        if (keepBox.checked) changed();
        else { storage.clear(); keepNote.textContent = 'Removed from this browser'; }
      });
      notes.addEventListener('input', ui.debounce(() => { c.notes = notes.value; changed(); }, 300));
      tlText.addEventListener('keydown', (e) => { if (e.key === 'Enter') addEvent(); });
      importInput.addEventListener('change', async () => {
        const file = importInput.files[0];
        importInput.value = '';
        if (!file) return;
        try {
          c = CR.fromJson(await file.text());
          renderAll();
          changed();
          ctx.toast('Case imported');
        } catch (e) {
          ctx.toast(`Import failed: ${e.message}`);
        }
      });

      tlTime.value = nowLocal();
      if (saved) keepNote.textContent = 'Restored from this browser';
      renderAll();

      return {
        // Indicators in the text are added; if there are none, the text becomes a note.
        receive(text) {
          const n = CR.addIocsFromText(c, text);
          if (n) ctx.toast(`Added ${n} indicator${n === 1 ? '' : 's'} to the case`);
          else {
            c.notes = c.notes ? `${c.notes}\n\n${text}` : text;
            notes.value = c.notes;
            ctx.toast('Added to case notes');
          }
          renderIocs();
          changed();
        },
        focus() { fTitle.el.focus(); },
      };
    },
  });
})();
</script>
</body>
