name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: dist/ is up to date with src/
        run: git diff --exit-code -- dist/ || (echo "Run 'npm run build' and commit dist/analyst-toolkit.html" && exit 1)

      # Uses the Google Chrome already installed on the runner (no browser download).
      - name: End-to-end smoke test (file://, no network allowed)
        run: npm run test:e2e
